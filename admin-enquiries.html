<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Enquiry — Jewellery by Riddhi Admin</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-top-bar {
      background-color: var(--primary-green);
      color: #fff;
      border-bottom: 2px solid var(--accent-gold);
    }
  </style>
</head>
<body>

  <nav class="admin-top-bar py-2 px-3 sticky-top shadow-sm">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
      <div class="d-flex align-items-center gap-2">
        <img src="assets/logo.png" alt="Logo" style="width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid var(--accent-gold);">
        <div>
          <h5 class="brand-font fw-bold m-0" style="color: var(--accent-gold-light);">Customer Enquiry</h5>
          <small class="text-light opacity-75" style="font-size: 11px;">Jewellery by Riddhi — Admin Enquiry Desk</small>
        </div>
      </div>
      <div class="d-flex flex-wrap align-items-center gap-2">
        <a href="admin-orders.html" class="btn btn-outline-warning btn-sm rounded-pill px-3">
          <i class="bi bi-people me-1"></i> Customer Order
        </a>
        <a href="admin-products.html" class="btn btn-outline-warning btn-sm rounded-pill px-3">
          <i class="bi bi-box-seam me-1"></i> Add/Edit/Delete Product
        </a>
        <a href="index.html" class="btn btn-outline-light btn-sm rounded-pill px-3">
          <i class="bi bi-arrow-left me-1"></i> Storefront
        </a>
        <button type="button" id="enqLogoutBtn" class="btn btn-danger btn-sm rounded-pill px-3 d-none" onclick="logoutEnqPage()">
          <i class="bi bi-box-arrow-right me-1"></i> Logout
        </button>
      </div>
    </div>
  </nav>

  <!-- ADMIN LOGIN GATE -->
  <div id="enqLoginGate" class="container my-5 d-none" style="max-width: 400px;">
    <div class="card border-0 shadow-sm" style="border-radius: 16px; border: 1.5px solid var(--accent-gold) !important;">
      <div class="card-header text-white text-center py-3" style="background-color: var(--primary-green); border-radius: 14px 14px 0 0;">
        <h5 class="brand-font m-0"><i class="bi bi-shield-lock me-2"></i>Admin Login — Customer Enquiry</h5>
      </div>
      <div class="card-body p-4">
        <div id="enqGateErr" class="alert alert-danger py-2 small d-none"></div>
        <form onsubmit="submitEnqGateLogin(event)">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Username</label>
            <input type="text" id="enqGateUser" class="form-control form-control-sm" required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Password</label>
            <input type="password" id="enqGatePass" class="form-control form-control-sm" required>
          </div>
          <button type="submit" id="enqGateBtn" class="btn btn-green btn-sm w-100 rounded-pill py-2 fw-semibold">Login</button>
        </form>
      </div>
    </div>
  </div>

  <!-- CUSTOMER ENQUIRY WORKSPACE -->
  <div id="enqWorkspace" class="container my-4 d-none">
    <div class="card border-0 shadow-sm p-3 mb-3 bg-white" style="border-radius: 14px;">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <span id="enqSourceBadge" class="badge bg-secondary">Source</span>
        <button type="button" class="btn btn-outline-dark btn-sm rounded-pill px-3" onclick="loadEnquiriesPageData()">
          <i class="bi bi-arrow-clockwise me-1"></i> Refresh Enquiries
        </button>
      </div>

      <div class="row g-2">
        <div class="col-12 col-md-4">
          <label class="form-label small fw-semibold mb-1">Search (Enquiry ID / Name / Mobile)</label>
          <input type="text" id="enqSearchInput" class="form-control form-control-sm" placeholder="Search ENQ-..., name, or mobile..." oninput="renderEnquiriesWorkspace()">
        </div>
        <div class="col-6 col-md-4">
          <label class="form-label small fw-semibold mb-1">Enquiry Status Filter</label>
          <select id="enqStatusFilter" class="form-select form-select-sm" onchange="renderEnquiriesWorkspace()">
            <option value="all" selected>All Enquiries</option>
            <option value="New Enquiry">New Enquiry</option>
            <option value="Contacted">Contacted</option>
            <option value="Confirmed">Confirmed</option>
            <option value="Completed">Completed</option>
            <option value="Closed">Closed</option>
          </select>
        </div>
        <div class="col-6 col-md-4">
          <label class="form-label small fw-semibold mb-1">Date-Wise Filter</label>
          <select id="enqDateFilter" class="form-select form-select-sm" onchange="toggleEnqCustomDateInput(); renderEnquiriesWorkspace()">
            <option value="all">All Dates</option>
            <option value="today">Today</option>
            <option value="7d">Last 7 Days</option>
            <option value="30d">Last 30 Days</option>
            <option value="3m">Last 3 Months</option>
            <option value="custom">Specific Date</option>
          </select>
        </div>
        <div class="col-12 col-md-4 d-none" id="enqCustomDateWrap">
          <label class="form-label small fw-semibold mb-1">Select Date</label>
          <input type="date" id="enqCustomDateInput" class="form-control form-control-sm" onchange="renderEnquiriesWorkspace()">
        </div>
      </div>
    </div>

    <div id="enqStatsSummaryBar" class="small fw-semibold mb-3 text-muted"></div>
    <div id="enqPageListContainer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js?v=17"></script>
  <script src="js/app.js?v=17"></script>
  <script>
    function escE(v) {
      return String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function toggleEnqCustomDateInput() {
      const val = document.getElementById("enqDateFilter")?.value;
      const wrap = document.getElementById("enqCustomDateWrap");
      if (wrap) wrap.classList.toggle("d-none", val !== "custom");
    }

    async function submitEnqGateLogin(e) {
      e.preventDefault();
      const u = document.getElementById("enqGateUser").value.trim();
      const p = document.getElementById("enqGatePass").value;
      const err = document.getElementById("enqGateErr");
      const btn = document.getElementById("enqGateBtn");
      err.classList.add("d-none");
      btn.disabled = true;
      try {
        if (typeof APPS_SCRIPT_URL !== "undefined" && APPS_SCRIPT_URL) {
          const res = await fetch(APPS_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "adminLogin", username: u, password: p })
          });
          const r = await res.json();
          if (!r.ok) {
            err.textContent = "Invalid username or password.";
            err.classList.remove("d-none");
            return;
          }
          const sess = { mode: "sheet", token: r.token };
          localStorage.setItem("riddhi_admin_session", JSON.stringify(sess));
          sessionStorage.setItem("riddhi_admin_session", JSON.stringify(sess));
          adminEnquiries = r.enquiries || [];
        } else {
          const h = await sha256Hex(u + ":" + p);
          if (u !== ADMIN_USERNAME || h !== ADMIN_LOCAL_HASH) {
            err.textContent = "Invalid username or password.";
            err.classList.remove("d-none");
            return;
          }
          const sess = { mode: "local" };
          localStorage.setItem("riddhi_admin_session", JSON.stringify(sess));
          sessionStorage.setItem("riddhi_admin_session", JSON.stringify(sess));
          try { adminEnquiries = JSON.parse(localStorage.getItem("riddhi_enquiries") || "[]"); } catch (ex) { adminEnquiries = []; }
        }
        initEnquiriesPage();
      } catch (ex) {
        err.textContent = "Login failed. Check connection and try again.";
        err.classList.remove("d-none");
      } finally {
        btn.disabled = false;
      }
    }

    function logoutEnqPage() {
      localStorage.removeItem("riddhi_admin_session");
      sessionStorage.removeItem("riddhi_admin_session");
      window.location.href = "index.html";
    }

    function matchEnqDate(ts, bucket, customIso) {
      if (bucket === "all") return true;
      const d = ts ? new Date(Number(ts)) : null;
      const now = new Date();
      if (bucket === "today") {
        if (!d || isNaN(d.getTime())) return false;
        return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
      }
      if (bucket === "7d") return ts && (Date.now() - Number(ts) <= 7 * 24 * 60 * 60 * 1000);
      if (bucket === "30d") return ts && (Date.now() - Number(ts) <= 30 * 24 * 60 * 60 * 1000);
      if (bucket === "3m") return ts && (Date.now() - Number(ts) <= 90 * 24 * 60 * 60 * 1000);
      if (bucket === "custom") {
        if (!customIso || !d || isNaN(d.getTime())) return true;
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, "0");
        const dd = String(d.getDate()).padStart(2, "0");
        return `${yyyy}-${mm}-${dd}` === customIso;
      }
      return true;
    }

    async function loadEnquiriesPageData() {
      const container = document.getElementById("enqPageListContainer");
      if (container) {
        container.innerHTML = `<div class="text-center text-muted py-4 small"><span class="spinner-border spinner-border-sm me-2"></span>Loading enquiries...</div>`;
      }
      const s = getAdminSession();
      if (s && s.mode === "sheet" && APPS_SCRIPT_URL) {
        try {
          const r = await callScript({ action: "getEnquiries", token: s.token });
          if (r && r.ok) adminEnquiries = r.enquiries || [];
        } catch (e) {}
      } else {
        try { adminEnquiries = JSON.parse(localStorage.getItem("riddhi_enquiries") || "[]"); } catch (e) { adminEnquiries = []; }
      }
      renderEnquiriesWorkspace();
    }

    function renderEnquiriesWorkspace() {
      const q = (document.getElementById("enqSearchInput")?.value || "").toLowerCase().trim();
      const stFilter = document.getElementById("enqStatusFilter")?.value || "all";
      const dateBucket = document.getElementById("enqDateFilter")?.value || "all";
      const customIso = document.getElementById("enqCustomDateInput")?.value || "";

      const list = (adminEnquiries || []).filter(eq => {
        const eid = String(eq.enquiryId || "").toLowerCase();
        const cname = String(eq.customerName || "").toLowerCase();
        const cmob = String(eq.mobile || "").toLowerCase();
        if (q && !eid.includes(q) && !cname.includes(q) && !cmob.includes(q)) return false;

        const st = eq.status || "New Enquiry";
        if (stFilter !== "all" && st !== stFilter) return false;
        return matchEnqDate(eq.timestamp, dateBucket, customIso);
      });

      const statsEl = document.getElementById("enqStatsSummaryBar");
      if (statsEl) {
        statsEl.innerHTML = `Showing Enquiries: <span style="color: var(--primary-green);">${list.length}</span>`;
      }

      const container = document.getElementById("enqPageListContainer");
      if (!container) return;

      if (list.length === 0) {
        container.innerHTML = `<div class="card border-0 shadow-sm p-4 text-center text-muted small bg-white">No customer enquiries match your search or filter.</div>`;
        return;
      }

      container.innerHTML = list.map(eq => {
        const st = eq.status || "New Enquiry";
        let wa = String(eq.mobile || "").replace(/[^0-9]/g, "").slice(-10);
        if (wa.length === 10) wa = "91" + wa;
        const waText = `Hello *Jewellery by Riddhi* Customer ${eq.customerName || ""}! ✨\n🆔 *Enquiry ID:* ${eq.enquiryId}\n🛍️ *Product:* ${eq.productName} (${eq.productId})\n📏 *Size:* ${eq.size} | *Needed Qty:* ${eq.requestedQty}\n📌 *Enquiry Status:* *${st}*\n${ENQUIRY_STATUS_DESC[st] || ""}`;

        return `
          <div class="card mb-3 border-0 shadow-sm bg-white">
            <div class="card-body p-3 small">
              <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-1">
                <div>
                  <span class="badge bg-warning text-dark me-1">${escE(eq.enquiryId)}</span>
                  <strong class="text-dark">${escE(eq.customerName)}</strong>
                  <span class="text-muted">(${escE(eq.mobile)})</span>
                </div>
                <span class="text-muted" style="font-size: 11px;">${escE(eq.date || "")}</span>
              </div>
              <div class="fw-semibold text-dark">${escE(eq.productName)} (${escE(eq.productId)}) — <span class="text-muted">${escE(eq.category || "")}</span></div>
              <div class="text-muted mb-1" style="font-size: 11px;">
                Size: <strong>${escE(eq.size)}</strong> | Ready Stock: <strong>${escE(eq.availableStock)}</strong> | Requested: <strong>${escE(eq.requestedQty)}</strong>
                ${Number(eq.extraQty) > 0 ? ` | <span class="text-danger fw-bold">Extra Needed: ${escE(eq.extraQty)}</span>` : ""}
              </div>
              ${eq.note ? `<div class="text-success mb-2" style="font-size: 11px;"><strong>Note:</strong> ${escE(eq.note)}</div>` : ""}
              <div class="d-flex flex-wrap align-items-center gap-2 mt-2">
                <select class="form-select form-select-sm w-auto" onchange="adminUpdateEnquiryStatus('${escE(eq.enquiryId)}', this.value, this)">
                  ${ENQUIRY_STATUS_OPTIONS.map(opt => `<option value="${opt}" ${opt === st ? "selected" : ""}>${opt}</option>`).join("")}
                </select>
                <a href="https://wa.me/${wa}?text=${encodeURIComponent(waText)}" target="_blank" rel="noopener" class="btn btn-outline-success btn-sm rounded-pill px-3" style="font-size: 11px;">
                  <i class="bi bi-whatsapp"></i> Notify Customer
                </a>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    async function initEnquiriesPage() {
      const s = getAdminSession();
      if (!s) {
        document.getElementById("enqLoginGate").classList.remove("d-none");
        document.getElementById("enqWorkspace").classList.add("d-none");
        document.getElementById("enqLogoutBtn").classList.add("d-none");
        return;
      }
      document.getElementById("enqLoginGate").classList.add("d-none");
      document.getElementById("enqWorkspace").classList.remove("d-none");
      document.getElementById("enqLogoutBtn").classList.remove("d-none");

      const badge = document.getElementById("enqSourceBadge");
      if (badge) {
        badge.className = "badge " + (s.mode === "sheet" ? "bg-success" : "bg-warning text-dark");
        badge.textContent = s.mode === "sheet" ? "Source: Google Sheet" : "Source: Local Device";
      }

      await loadEnquiriesPageData();
    }

    document.addEventListener("DOMContentLoaded", initEnquiriesPage);
  </script>
</body>
</html>
