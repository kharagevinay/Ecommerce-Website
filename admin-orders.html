<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Order — Jewellery by Riddhi Admin</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-top-bar {
      background-color: var(--primary-green);
      color: #fff;
      border-bottom: 2px solid var(--accent-gold);
    }
  </style>
</head>
<body>

  <nav class="admin-top-bar py-2 px-3 sticky-top shadow-sm">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
      <div class="d-flex align-items-center gap-2">
        <img src="assets/logo.png" alt="Logo" style="width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid var(--accent-gold);">
        <div>
          <h5 class="brand-font fw-bold m-0" style="color: var(--accent-gold-light);">Customer Order</h5>
          <small class="text-light opacity-75" style="font-size: 11px;">Jewellery by Riddhi — Admin Orders Desk</small>
        </div>
      </div>
      <div class="d-flex flex-wrap align-items-center gap-2">
        <a href="admin-enquiries.html" class="btn btn-outline-warning btn-sm rounded-pill px-3">
          <i class="bi bi-chat-dots me-1"></i> Customer Enquiry
        </a>
        <a href="admin-offers.html" class="btn btn-outline-warning btn-sm rounded-pill px-3"><i class="bi bi-megaphone me-1"></i> Offers</a>
        <a href="admin-categories.html" class="btn btn-outline-warning btn-sm rounded-pill px-3"><i class="bi bi-grid-fill me-1"></i> Shop by Category</a>
        <a href="admin-products.html" class="btn btn-outline-warning btn-sm rounded-pill px-3">
          <i class="bi bi-box-seam me-1"></i> Add/Edit/Delete Product
        </a>
        <a href="index.html" class="btn btn-outline-light btn-sm rounded-pill px-3">
          <i class="bi bi-arrow-left me-1"></i> Storefront
        </a>
        <button type="button" id="ordersLogoutBtn" class="btn btn-danger btn-sm rounded-pill px-3 d-none" onclick="logoutOrdersPage()">
          <i class="bi bi-box-arrow-right me-1"></i> Logout
        </button>
      </div>
    </div>
  </nav>

  <!-- ADMIN LOGIN GATE -->
  <div id="ordersLoginGate" class="container my-5 d-none" style="max-width: 400px;">
    <div class="card border-0 shadow-sm" style="border-radius: 16px; border: 1.5px solid var(--accent-gold) !important;">
      <div class="card-header text-white text-center py-3" style="background-color: var(--primary-green); border-radius: 14px 14px 0 0;">
        <h5 class="brand-font m-0"><i class="bi bi-shield-lock me-2"></i>Admin Login — Customer Order</h5>
      </div>
      <div class="card-body p-4">
        <div id="ordersGateErr" class="alert alert-danger py-2 small d-none"></div>
        <form onsubmit="submitOrdersGateLogin(event)">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Username</label>
            <input type="text" id="ordGateUser" class="form-control form-control-sm" required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Password</label>
            <input type="password" id="ordGatePass" class="form-control form-control-sm" required>
          </div>
          <button type="submit" id="ordGateBtn" class="btn btn-green btn-sm w-100 rounded-pill py-2 fw-semibold">Login</button>
        </form>
      </div>
    </div>
  </div>

  <!-- CUSTOMER ORDER WORKSPACE -->
  <div id="ordersWorkspace" class="container my-4 d-none">
    <div class="card border-0 shadow-sm p-3 mb-3 bg-white" style="border-radius: 14px;">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <span id="ordersSourceBadge" class="badge bg-secondary">Source</span>
        <div class="d-flex flex-wrap align-items-center gap-2">
          <div class="form-check form-switch m-0">
            <input class="form-check-input" type="checkbox" role="switch" id="ordAutoDeliverSwitch" checked onchange="toggleOrdPageAutoDeliver(this.checked)">
            <label class="form-check-label small fw-semibold" for="ordAutoDeliverSwitch" style="font-size: 11px;">Auto-Delivered (5d)</label>
          </div>
          <button type="button" class="btn btn-outline-dark btn-sm rounded-pill px-3" onclick="loadOrdersPageData()">
            <i class="bi bi-arrow-clockwise me-1"></i> Refresh
          </button>
          <button type="button" class="btn btn-outline-success btn-sm rounded-pill px-3" onclick="downloadOrdersCsvFromPage()">
            <i class="bi bi-download me-1"></i> CSV
          </button>
        </div>
      </div>

      <div class="row g-2">
        <div class="col-12 col-md-4">
          <label class="form-label small fw-semibold mb-1">Search (Order ID / Name / Mobile)</label>
          <input type="text" id="ordSearchInput" class="form-control form-control-sm" placeholder="Search ORD-..., name, or 10-digit mobile..." oninput="renderOrdersWorkspace()">
        </div>
        <div class="col-6 col-md-4">
          <label class="form-label small fw-semibold mb-1">Order Status Filter</label>
          <select id="ordStatusFilter" class="form-select form-select-sm" onchange="renderOrdersWorkspace()">
            <option value="recent" selected>Recent Orders (Last 7 Days)</option>
            <option value="all">All Orders</option>
            <option value="Pending">Order Placed</option>
            <option value="Confirmed">Confirmation</option>
            <option value="Shipped">Shipped</option>
            <option value="Delivered">Delivered</option>
            <option value="Cancelled">Cancelled</option>
          </select>
        </div>
        <div class="col-6 col-md-4">
          <label class="form-label small fw-semibold mb-1">Date-Wise Filter</label>
          <select id="ordDateFilter" class="form-select form-select-sm" onchange="toggleOrdCustomDateInput(); renderOrdersWorkspace()">
            <option value="all">All Dates</option>
            <option value="today">Today</option>
            <option value="7d">Last 7 Days</option>
            <option value="30d">Last 30 Days</option>
            <option value="3m">Last 3 Months</option>
            <option value="custom">Specific Date</option>
          </select>
        </div>
        <div class="col-12 col-md-4 d-none" id="ordCustomDateWrap">
          <label class="form-label small fw-semibold mb-1">Select Date</label>
          <input type="date" id="ordCustomDateInput" class="form-control form-control-sm" onchange="renderOrdersWorkspace()">
        </div>
      </div>
    </div>

    <div id="adminLiveNotifBanner" class="alert alert-warning d-none d-flex flex-wrap justify-content-between align-items-center gap-2 py-2 px-3 mb-3 shadow-sm" style="border-radius: 12px; border: 1.5px solid var(--accent-gold);">
      <div class="small fw-semibold text-dark" id="adminLiveNotifText">
        <i class="bi bi-bell-fill text-danger me-1"></i> New updates received!
      </div>
      <button type="button" class="btn btn-dark btn-sm rounded-pill px-3 py-0" style="font-size: 11px;" onclick="dismissAdminLiveNotif()">Mark Seen</button>
    </div>
    <div id="ordStatsSummaryBar" class="small fw-semibold mb-3 text-muted"></div>
    <div id="ordCardsContainer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js?v=36"></script>
  <script src="js/app.js?v=36"></script>
  <script>
    function escO(v) {
      return String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function toggleOrdCustomDateInput() {
      const val = document.getElementById("ordDateFilter")?.value;
      const wrap = document.getElementById("ordCustomDateWrap");
      if (wrap) wrap.classList.toggle("d-none", val !== "custom");
    }

    async function submitOrdersGateLogin(e) {
      e.preventDefault();
      const u = document.getElementById("ordGateUser").value.trim();
      const p = document.getElementById("ordGatePass").value;
      const err = document.getElementById("ordersGateErr");
      const btn = document.getElementById("ordGateBtn");
      err.classList.add("d-none");
      btn.disabled = true;
      try {
        if (typeof APPS_SCRIPT_URL !== "undefined" && APPS_SCRIPT_URL) {
          const res = await fetch(APPS_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "adminLogin", username: u, password: p })
          });
          const r = await res.json();
          if (!r.ok) {
            err.textContent = "Invalid username or password.";
            err.classList.remove("d-none");
            return;
          }
          const sess = { mode: "sheet", token: r.token };
          localStorage.setItem("riddhi_admin_session", JSON.stringify(sess));
          sessionStorage.setItem("riddhi_admin_session", JSON.stringify(sess));
          adminOrders = r.orders || [];
        } else {
          const h = await sha256Hex(u + ":" + p);
          if (u !== ADMIN_USERNAME || h !== ADMIN_LOCAL_HASH) {
            err.textContent = "Invalid username or password.";
            err.classList.remove("d-none");
            return;
          }
          const sess = { mode: "local" };
          localStorage.setItem("riddhi_admin_session", JSON.stringify(sess));
          sessionStorage.setItem("riddhi_admin_session", JSON.stringify(sess));
          adminOrders = getLocalOrders();
        }
        initOrdersPage();
      } catch (ex) {
        err.textContent = "Login failed. Check connection and try again.";
        err.classList.remove("d-none");
      } finally {
        btn.disabled = false;
      }
    }

    function logoutOrdersPage() {
      localStorage.removeItem("riddhi_admin_session");
      sessionStorage.removeItem("riddhi_admin_session");
      window.location.reload();
    }

    function toggleOrdPageAutoDeliver(flag) {
      toggleAutoDeliverSetting(flag);
    }

    function downloadOrdersCsvFromPage() {
      exportOrdersCsv();
    }

    async function loadOrdersPageData() {
      const container = document.getElementById("ordCardsContainer");
      if (container) {
        container.innerHTML = `<div class="text-center text-muted py-4 small"><span class="spinner-border spinner-border-sm me-2"></span>Loading orders...</div>`;
      }
      await loadAdminOrders();
      updateAdminNotifBanner((adminOrders || []).length, (adminEnquiries || []).length);
      renderOrdersWorkspace();
    }

    function matchDateBucket(ts, dateStr, bucket, customIso) {
      if (bucket === "all") return true;
      const d = ts ? new Date(Number(ts)) : null;
      const now = new Date();
      if (bucket === "today") {
        if (!d || isNaN(d.getTime())) return false;
        return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
      }
      if (bucket === "7d") {
        return ts && (Date.now() - Number(ts) <= 7 * 24 * 60 * 60 * 1000);
      }
      if (bucket === "30d") {
        return ts && (Date.now() - Number(ts) <= 30 * 24 * 60 * 60 * 1000);
      }
      if (bucket === "3m") {
        return ts && (Date.now() - Number(ts) <= 90 * 24 * 60 * 60 * 1000);
      }
      if (bucket === "custom") {
        if (!customIso || !d || isNaN(d.getTime())) return true;
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, "0");
        const dd = String(d.getDate()).padStart(2, "0");
        return `${yyyy}-${mm}-${dd}` === customIso;
      }
      return true;
    }

    function renderOrdersWorkspace() {
      const q = (document.getElementById("ordSearchInput")?.value || "").toLowerCase().trim();
      const stFilter = document.getElementById("ordStatusFilter")?.value || "recent";
      const dateBucket = document.getElementById("ordDateFilter")?.value || "all";
      const customIso = document.getElementById("ordCustomDateInput")?.value || "";

      const recentCutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;

      const filtered = (adminOrders || []).filter(ord => {
        const cust = ord.customer || {};
        const oid = String(ord.orderId || "").toLowerCase();
        const cname = String(cust.name || "").toLowerCase();
        const cmob = String(cust.mobile || "").toLowerCase();

        if (q && !oid.includes(q) && !cname.includes(q) && !cmob.includes(q)) {
          return false;
        }

        const normSt = normStatus(ord.status);
        if (stFilter === "recent") {
          if ((Number(ord.timestamp) || 0) < recentCutoff) return false;
        } else if (stFilter !== "all") {
          if (stFilter === "Confirmed") {
            if (!["Confirmed", "Custom Making / Partial Stock Ready", "Packed"].includes(normSt)) return false;
          } else if (normSt !== stFilter) {
            return false;
          }
        }

        return matchDateBucket(ord.timestamp, ord.date, dateBucket, customIso);
      });

      const revenue = filtered.reduce((sum, o) => sum + (Number(o.total) || 0), 0);
      const statsEl = document.getElementById("ordStatsSummaryBar");
      if (statsEl) {
        statsEl.innerHTML = `Showing Orders: <span style="color: var(--primary-green);">${filtered.length}</span> | Total Amount: <span style="color: var(--primary-green);">₹${revenue}</span>`;
      }

      const container = document.getElementById("ordCardsContainer");
      if (!container) return;

      if (filtered.length === 0) {
        container.innerHTML = `<div class="card border-0 shadow-sm p-4 text-center text-muted small bg-white">No customer orders match your search or filter.</div>`;
        return;
      }

      container.innerHTML = filtered.map(ord => {
        const cust = ord.customer || {};
        let wa = String(cust.mobile || "").replace(/[^0-9]/g, "").slice(-10);
        if (wa.length === 10) wa = "91" + wa;
        const isRecent = (Number(ord.timestamp) || 0) >= recentCutoff;

        return `
          <div class="card mb-3 border-0 shadow-sm bg-white">
            <div class="card-body p-3 small">
              <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
                <div>
                  <span class="badge" style="background-color: var(--primary-green);">${escO(ord.orderId)}</span>
                  <span class="badge ${isRecent ? "bg-success" : "bg-secondary"} ms-1">${isRecent ? "Recent" : "Older"}</span>
                  <span class="text-muted ms-2" style="font-size: 11px;"><i class="bi bi-clock me-1"></i>${escO(ord.date)}</span>
                </div>
                <div class="fw-bold fs-6" style="color: var(--primary-green);">₹${escO(ord.total)}</div>
              </div>

              <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-2 p-2 rounded" style="background-color: #fdfaf5; border: 1px solid #efe3d2;">
                <div>
                  <div class="fw-bold text-dark">👤 ${escO(cust.name)}</div>
                  <div class="text-muted"><i class="bi bi-telephone me-1"></i>${escO(cust.mobile)}</div>
                  <div class="text-muted" style="font-size: 11px;">${escO(cust.address)}, ${escO(cust.city)} - ${escO(cust.pincode)}</div>
                </div>
                <a href="https://wa.me/${wa}" target="_blank" rel="noopener" class="btn btn-outline-success btn-sm rounded-pill px-3" style="font-size: 11px;">
                  <i class="bi bi-whatsapp me-1"></i> WhatsApp Chat
                </a>
              </div>

              ${adminStatusControl(ord.orderId, ord.status, cust.name, cust.mobile, ord.cancelReason || "")}
              <div class="mt-2">${buildItemsHtml(ord.items, ord.orderId)}</div>
            </div>
          </div>
        `;
      }).join("");
    }

    async function initOrdersPage() {
      const s = getAdminSession();
      if (!s) {
        document.getElementById("ordersLoginGate").classList.remove("d-none");
        document.getElementById("ordersWorkspace").classList.add("d-none");
        document.getElementById("ordersLogoutBtn").classList.add("d-none");
        return;
      }
      document.getElementById("ordersLoginGate").classList.add("d-none");
      document.getElementById("ordersWorkspace").classList.remove("d-none");
      document.getElementById("ordersLogoutBtn").classList.remove("d-none");

      const badge = document.getElementById("ordersSourceBadge");
      if (badge) {
        badge.className = "badge " + (s.mode === "sheet" ? "bg-success" : "bg-warning text-dark");
        badge.textContent = s.mode === "sheet" ? "Source: Google Sheet" : "Source: Local Device";
      }

      await loadOrdersPageData();
    }

    
    function updateAdminNotifBanner(ordCnt, enqCnt) {
      const seenOrd = Number(localStorage.getItem("riddhi_seen_orders_cnt") || 0);
      const seenEnq = Number(localStorage.getItem("riddhi_seen_enquiries_cnt") || 0);
      const newO = Math.max(0, (ordCnt || 0) - seenOrd);
      const newE = Math.max(0, (enqCnt || 0) - seenEnq);
      const banner = document.getElementById("adminLiveNotifBanner");
      const txt = document.getElementById("adminLiveNotifText");
      if (!banner || !txt) return;
      if (newO > 0 || newE > 0) {
        const parts = [];
        if (newO > 0) parts.push(`${newO} New Order(s)`);
        if (newE > 0) parts.push(`${newE} New Enquiry(ies)`);
        txt.innerHTML = `<i class="bi bi-bell-fill text-danger me-1"></i> <strong>New Notification:</strong> ${parts.join(" & ")}!`;
        banner.classList.remove("d-none");
      } else {
        banner.classList.add("d-none");
      }
    }
    function dismissAdminLiveNotif() {
      localStorage.setItem("riddhi_seen_orders_cnt", String((adminOrders || []).length));
      localStorage.setItem("riddhi_seen_enquiries_cnt", String((adminEnquiries || []).length));
      document.getElementById("adminLiveNotifBanner")?.classList.add("d-none");
    }

    document.addEventListener("DOMContentLoaded", initOrdersPage);
  </script>
</body>
</html>
